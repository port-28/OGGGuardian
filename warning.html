<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>危険なサイトをブロックしました - OGGGuardian</title>
  <link rel="stylesheet" href="warning.css">
</head>
<body>

  <main class="container">
    <!-- §1 大サイズ -->
    <h1 class="title">危険なサイトをブロックしました</h1>

    <!-- §2 中サイズ -->
    <p class="message">
      もし、電話やチャットによって誘導された場合は、<br>
      今すぐ会話を中断し、相手をブロックしてください
    </p>

    <!-- §3 ボタン -->
    <div class="action-area">
      <!-- onclick属性を削除 -->
      <button id="close-btn" class="close-button">
        このサイトを閉じる
      </button>
    </div>
  </main>

  <!-- 追加：warning.js の読み込み -->
  <script src="warning.js"></script>
</body>
</html>
